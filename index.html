<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Decimal Squares</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #222;
    text-align: center;
}

header {
    background: #2563eb;
    color: white;
    padding: 20px;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin: 6px 0 0;
}

.controls {
    background: white;
    width: min(1000px, 94%);
    margin: 20px auto;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 4px 15px rgba(0,0,0,.1);
}

h2 {
    margin: 12px 0 8px;
    font-size: 20px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 16px;
    cursor: pointer;
    margin: 4px;
}

.operation {
    background: #e5e7eb;
}

.operation.selected {
    background: #2563eb;
    color: white;
}

.place {
    background: #e5e7eb;
}

.place.selected {
    background: #16a34a;
    color: white;
}

.square-control {
    background: #7c3aed;
    color: white;
}

.square-control:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

.clear {
    background: #dc2626;
    color: white;
    margin-top: 12px;
}

.square-count {
    font-weight: bold;
    margin: 10px 0;
    font-size: 17px;
}

.workspace {
    width: min(1200px, 96%);
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 4px 15px rgba(0,0,0,.1);
}

.squares {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
    flex-wrap: wrap;
}

.square-area {
    min-width: 280px;
}

.square-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
}

.value-display {
    font-size: 27px;
    font-weight: bold;
    margin-bottom: 15px;
}

.operator {
    font-size: 45px;
    font-weight: bold;
}

.grid {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: stretch;
    margin: auto;
    border: 3px solid #222;
    background: white;
    width: 300px;
    height: 300px;
}

.column {
    display: flex;
    flex-direction: column;
    flex: 1;
}

.cell {
    flex: 1;
    border: 1px solid #aaa;
    background: white;
    cursor: pointer;
}

.cell:hover {
    background: #dbeafe;
}

.cell.filled {
    background: #60a5fa;
}

.result-grid .cell {
    cursor: default;
}

.result-grid .cell.result {
    background: #22c55e;
}

.result-area {
    margin-top: 40px;
}

.instructions {
    margin-top: 25px;
    color: #555;
    line-height: 1.5;
}

.error {
    color: #dc2626;
    font-weight: bold;
    min-height: 24px;
    margin-top: 10px;
}

@media (max-width: 650px) {

    .grid {
        width: 260px;
        height: 260px;
    }

    .operator {
        width: 100%;
    }

    button {
        padding: 11px 14px;
    }
}
</style>

</head>

<body>

<header>
    <h1>Decimal Squares</h1>
    <p>Build decimals with vertical columns</p>
</header>

<div class="controls">

```
<h2>Operation</h2>

<button id="addBtn" class="operation selected">
    Add +
</button>

<button id="subtractBtn" class="operation">
    Subtract −
</button>

<button id="multiplyBtn" class="operation">
    Multiply ×
</button>

<button id="divideBtn" class="operation">
    Divide ÷
</button>

<h2>Decimal Place</h2>

<button id="hundredthsBtn" class="place">
    Hundredths
</button>

<h2>Number of Squares</h2>

<button id="addSquareBtn" class="square-control">
    + Add Square
</button>

<button id="removeSquareBtn" class="square-control">
    − Remove Square
</button>

<div id="squareCount" class="square-count">
    2 squares
</div>

<button id="clearBtn" class="clear">
    Clear Squares
</button>

<div id="error" class="error"></div>
```

</div>

<div class="workspace">

```
<div id="squaresContainer" class="squares"></div>

<div class="result-area">

    <div class="operator">=</div>

    <div class="square-title">
        Result
    </div>

    <div id="resultNumber" class="value-display">
        0.00
    </div>

    <div id="resultGrid" class="grid result-grid"></div>

</div>

<div class="instructions">
    <strong>Click anywhere inside a vertical column.</strong><br>
    The column fills from the bottom up to where you click.
</div>
```

</div>

<script>

let operation = "add";
let decimalPlace = "tenths";

/*
    Start with exactly 2 numbers.
*/
let values = [0, 0];


/*
    Minimum is the original 2 squares.
    More can be added whenever needed.
*/
const MIN_SQUARES = 2;
const MAX_SQUARES = 10;


/*
    Information for each decimal place.
*/
const placeInfo = {

    tenths: {
        columnValue: 0.1,
        cellValue: 0.01,
        digits: 2
    },

    hundredths: {
        columnValue: 0.01,
        cellValue: 0.001,
        digits: 3
    },

    thousandths: {
        columnValue: 0.001,
        cellValue: 0.0001,
        digits: 4
    }

};


/*
    Operation buttons
*/

function setOperation(newOperation) {

    operation = newOperation;

    document.querySelectorAll(".operation")
        .forEach(button => {
            button.classList.remove("selected");
        });

    if (operation === "add") {
        document.getElementById("addBtn")
            .classList.add("selected");
    }

    if (operation === "subtract") {
        document.getElementById("subtractBtn")
            .classList.add("selected");
    }

    if (operation === "multiply") {
        document.getElementById("multiplyBtn")
            .classList.add("selected");
    }

    if (operation === "divide") {
        document.getElementById("divideBtn")
            .classList.add("selected");
    }

    updateOperatorDisplay();
    updateResult();
}


/*
    Decimal place buttons
*/

function setDecimalPlace(place) {

    decimalPlace = place;

    document.querySelectorAll(".place")
        .forEach(button => {
            button.classList.remove("selected");
        });

    if (place === "tenths") {
        document.getElementById("tenthsBtn")
            .classList.add("selected");
    }

    if (place === "hundredths") {
        document.getElementById("hundredthsBtn")
            .classList.add("selected");
    }

    if (place === "thousandths") {
        document.getElementById("thousandthsBtn")
            .classList.add("selected");
    }

    /*
        Reset the values when changing
        decimal precision.
    */
    values = values.map(() => 0);

    buildAllSquares();
    updateResult();
}


/*
    Add another number/square.
*/

function addSquare() {

    if (values.length >= MAX_SQUARES) {
        return;
    }

    values.push(0);

    buildAllSquares();
    updateResult();
}


/*
    Remove a number/square.

    It cannot remove the original 2.
*/

function removeSquare() {

    if (values.length <= MIN_SQUARES) {
        return;
    }

    values.pop();

    buildAllSquares();
    updateResult();
}


/*
    Creates one visual square.
*/

function createSquare(index) {

    const area =
        document.createElement("div");

    area.className = "square-area";

    const title =
        document.createElement("div");

    title.className = "square-title";

    title.textContent =
        "Number " + (index + 1);

    const valueDisplay =
        document.createElement("div");

    valueDisplay.className =
        "value-display";

    valueDisplay.id =
        "value-" + index;

    const grid =
        document.createElement("div");

    grid.className = "grid";

    grid.id =
        "grid-" + index;

    area.appendChild(title);
    area.appendChild(valueDisplay);
    area.appendChild(grid);

    buildGrid(grid, index);

    return area;
}


/*
    Build every number square.
*/

function buildAllSquares() {

    const container =
        document.getElementById("squaresContainer");

    container.innerHTML = "";

    for (
        let i = 0;
        i < values.length;
        i++
    ) {

        /*
            Add an operator before every
            square except the first.
        */

        if (i > 0) {

            const operator =
                document.createElement("div");

            operator.className = "operator";

            const symbols = {
                add: "+",
                subtract: "−",
                multiply: "×",
                divide: "÷"
            };

            operator.textContent =
                symbols[operation];

            container.appendChild(operator);
        }

        container.appendChild(
            createSquare(i)
        );
    }

    updateSquareCount();
}


/*
    Build the vertical grid for one number.
*/

function buildGrid(grid, index) {

    const info =
        placeInfo[decimalPlace];

    grid.innerHTML = "";

    const totalColumns = 10;
    const cellsPerColumn = 10;

    const currentValue =
        values[index];

    const completeColumns =
        Math.floor(
            currentValue /
            info.columnValue +
            0.0000001
        );

    const remainder =
        currentValue -
        (completeColumns *
         info.columnValue);

    const partialCells =
        Math.round(
            remainder /
            info.cellValue
        );

    for (
        let columnIndex = 0;
        columnIndex < totalColumns;
        columnIndex++
    ) {

        const column =
            document.createElement("div");

        column.className = "column";

        for (
            let rowIndex = 0;
            rowIndex < cellsPerColumn;
            rowIndex++
        ) {

            const cell =
                document.createElement("div");

            cell.className = "cell";

            /*
                Bottom cell = 1
                Top cell = 10
            */

            const cellsFromBottom =
                cellsPerColumn -
                rowIndex;

            let filled = false;

            if (
                columnIndex <
                completeColumns
            ) {

                filled = true;

            } else if (
                columnIndex ===
                completeColumns &&
                cellsFromBottom <=
                partialCells
            ) {

                filled = true;
            }

            if (filled) {
                cell.classList.add("filled");
            }

            /*
                Clicking anywhere in the column
                changes its height to the clicked
                position.
            */

            cell.addEventListener(
                "click",
                () => {

                    const clickedHeight =
                        cellsFromBottom;

                    const newValue =
                        (columnIndex *
                         info.columnValue) +

                        (clickedHeight *
                         info.cellValue);

                    values[index] =
                        Math.round(
                            newValue * 10000
                        ) / 10000;

                    values[index] =
                        Math.max(
                            0,
                            Math.min(
                                1,
                                values[index]
                            )
                        );

                    buildAllSquares();
                    updateResult();
                }
            );

            column.appendChild(cell);
        }

        grid.appendChild(column);
    }


    /*
        Update the displayed number.
    */

    const display =
        document.getElementById(
            "value-" + index
        );

    if (display) {

        display.textContent =
            values[index].toFixed(
                info.digits
            );
    }
}


/*
    Update the operator symbols.
*/

function updateOperatorDisplay() {

    const symbols = {
        add: "+",
        subtract: "−",
        multiply: "×",
        divide: "÷"
    };

    document.querySelectorAll(
        "#squaresContainer .operator"
    ).forEach(operator => {

        operator.textContent =
            symbols[operation];
    });
}


/*
    Calculate the final result.
*/

function calculateResult() {

    if (values.length === 0) {
        return 0;
    }

    let result =
        values[0];

    if (operation === "add") {

        result = values.reduce(
            (total, value) =>
                total + value,
            0
        );

    } else if (operation === "subtract") {

        result = values.slice(1).reduce(
            (total, value) =>
                total - value,
            values[0]
        );

    } else if (operation === "multiply") {

        result = values.reduce(
            (total, value) =>
                total * value,
            1
        );

    } else if (operation === "divide") {

        for (
            let i = 1;
            i < values.length;
            i++
        ) {

            if (values[i] === 0) {
                return null;
            }

            result =
                result / values[i];
        }
    }

    return Math.round(
        result * 10000
    ) / 10000;
}


/*
    Update result display and grid.
*/

function updateResult() {

    const error =
        document.getElementById("error");

    error.textContent = "";

    const result =
        calculateResult();

    const info =
        placeInfo[decimalPlace];

    if (result === null) {

        document.getElementById(
            "resultNumber"
        ).textContent = "Undefined";

        error.textContent =
            "You cannot divide by zero.";

        buildResultGrid(0);
        return;
    }

    document.getElementById(
        "resultNumber"
    ).textContent =
        result.toFixed(info.digits);

    buildResultGrid(result);
}


/*
    Build the result grid.
*/

function buildResultGrid(result) {

    const grid =
        document.getElementById(
            "resultGrid"
        );

    const info =
        placeInfo[decimalPlace];

    grid.innerHTML = "";

    /*
        The visual grid can represent
        values from 0 through 1.
    */

    const displayValue =
        Math.max(
            0,
            Math.min(
                1,
                result
            )
        );

    const totalCells =
        Math.round(
            displayValue /
            info.cellValue
        );

    const totalColumns = 10;
    const cellsPerColumn = 10;

    for (
        let columnIndex = 0;
        columnIndex < totalColumns;
        columnIndex++
    ) {

        const column =
            document.createElement("div");

        column.className = "column";

        for (
            let rowIndex = 0;
            rowIndex < cellsPerColumn;
            rowIndex++
        ) {

            const cell =
                document.createElement("div");

            cell.className = "cell";

            const cellNumber =
                columnIndex *
                cellsPerColumn +
                (cellsPerColumn -
                 rowIndex);

            if (
                cellNumber <=
                totalCells
            ) {

                cell.classList.add(
                    "result"
                );
            }

            column.appendChild(cell);
        }

        grid.appendChild(column);
    }
}


/*
    Update the square counter and
    disable Remove at the minimum.
*/

function updateSquareCount() {

    const count =
        values.length;

    document.getElementById(
        "squareCount"
    ).textContent =
        count +
        (count === 1
            ? " square"
            : " squares");

    document.getElementById(
        "removeSquareBtn"
    ).disabled =
        count <= MIN_SQUARES;

    document.getElementById(
        "addSquareBtn"
    ).disabled =
        count >= MAX_SQUARES;
}


/*
    Clear all numbers but keep
    the current number of squares.
*/

function clearSquares() {

    values =
        values.map(() => 0);

    buildAllSquares();
    updateResult();
}


/*
    Button listeners
*/

document.getElementById("addBtn")
    .addEventListener(
        "click",
        () => setOperation("add")
    );

document.getElementById("subtractBtn")
    .addEventListener(
        "click",
        () => setOperation("subtract")
    );

document.getElementById("multiplyBtn")
    .addEventListener(
        "click",
        () => setOperation("multiply")
    );

document.getElementById("divideBtn")
    .addEventListener(
        "click",
        () => setOperation("divide")
    );


document.getElementById("tenthsBtn")
    .addEventListener(
        "click",
        () => setDecimalPlace("tenths")
    );

document.getElementById("hundredthsBtn")
    .addEventListener(
        "click",
        () => setDecimalPlace("hundredths")
    );

document.getElementById("thousandthsBtn")
    .addEventListener(
        "click",
        () => setDecimalPlace("thousandths")
    );


document.getElementById("addSquareBtn")
    .addEventListener(
        "click",
        addSquare
    );

document.getElementById("removeSquareBtn")
    .addEventListener(
        "click",
        removeSquare
    );

document.getElementById("clearBtn")
    .addEventListener(
        "click",
        clearSquares
    );


/*
    Start with the original 2 squares.
*/

buildAllSquares();
updateResult();
updateSquareCount();

</script>

</body>
</html>
