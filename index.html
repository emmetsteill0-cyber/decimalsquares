<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Decimal Squares</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #222;
    text-align: center;
}

header {
    background: #2563eb;
    color: white;
    padding: 20px;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin: 6px 0 0;
}

.controls {
    background: white;
    width: min(950px, 94%);
    margin: 20px auto;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 4px 15px rgba(0,0,0,.1);
}

h2 {
    margin: 12px 0 8px;
    font-size: 20px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 16px;
    cursor: pointer;
    margin: 4px;
}

.operation {
    background: #e5e7eb;
}

.operation.selected {
    background: #2563eb;
    color: white;
}

.place {
    background: #e5e7eb;
}

.place.selected {
    background: #16a34a;
    color: white;
}

.clear {
    background: #dc2626;
    color: white;
    margin-top: 12px;
}

.workspace {
    width: min(1100px, 96%);
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 4px 15px rgba(0,0,0,.1);
}

.squares {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    flex-wrap: wrap;
}

.square-area {
    min-width: 280px;
}

.square-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
}

.value-display {
    font-size: 27px;
    font-weight: bold;
    margin-bottom: 15px;
}

.operator {
    font-size: 45px;
    font-weight: bold;
}

.grid {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: stretch;
    margin: auto;
    border: 3px solid #222;
    background: white;
    width: 300px;
    height: 300px;
}

.column {
    display: flex;
    flex-direction: column;
    flex: 1;
}

.cell {
    flex: 1;
    border: 1px solid #aaa;
    background: white;
    cursor: pointer;
    transition: background .08s;
}

.cell:hover {
    background: #dbeafe;
}

.cell.filled-a {
    background: #60a5fa;
}

.cell.filled-b {
    background: #f59e0b;
}

.cell.result {
    background: #22c55e;
    cursor: default;
}

.result-area {
    margin-top: 35px;
}

.instructions {
    margin-top: 25px;
    color: #555;
    line-height: 1.5;
}

.error {
    color: #dc2626;
    font-weight: bold;
    min-height: 24px;
    margin-top: 10px;
}

@media (max-width: 650px) {

    .grid {
        width: 260px;
        height: 260px;
    }

    .operator {
        width: 100%;
    }

    button {
        padding: 11px 14px;
    }
}
</style>

</head>

<body>

<header>
    <h1>Decimal Squares</h1>
    <p>Build decimals with vertical columns</p>
</header>

<div class="controls">

```
<h2>Operation</h2>

<button id="addBtn" class="operation selected">
    Add +
</button>

<button id="subtractBtn" class="operation">
    Subtract −
</button>

<button id="multiplyBtn" class="operation">
    Multiply ×
</button>

<button id="divideBtn" class="operation">
    Divide ÷
</button>

<h2>Decimal Place</h2>

<button id="tenthsBtn" class="place selected">
    Tenths
</button>

<button id="hundredthsBtn" class="place">
    Hundredths
</button>

<button id="thousandthsBtn" class="place">
    Thousandths
</button>

<br>

<button id="clearBtn" class="clear">
    Clear Squares
</button>

<div id="error" class="error"></div>
```

</div>

<div class="workspace">

```
<div class="squares">

    <div class="square-area">

        <div class="square-title">
            First Number
        </div>

        <div id="valueA" class="value-display">
            0.0
        </div>

        <div id="gridA" class="grid"></div>

    </div>

    <div id="operator" class="operator">
        +
    </div>

    <div class="square-area">

        <div class="square-title">
            Second Number
        </div>

        <div id="valueB" class="value-display">
            0.0
        </div>

        <div id="gridB" class="grid"></div>

    </div>

</div>

<div class="result-area">

    <div class="operator">=</div>

    <div class="square-title">
        Result
    </div>

    <div id="resultNumber" class="value-display">
        0.0
    </div>

    <div id="resultGrid" class="grid"></div>

</div>

<div class="instructions">
    <strong>Click anywhere inside a vertical column.</strong><br>
    The column will fill from the bottom up to where you clicked.
    Click a filled area again to change its height.
</div>
```

</div>

<script>

let operation = "add";
let decimalPlace = "tenths";

let values = {
    a: 0,
    b: 0
};


/*
    Each column represents the selected
    decimal place.

    Each column is divided into 10
    smaller sections so you can click
    at different heights.
*/

const placeInfo = {

    tenths: {
        columnValue: 0.1,
        cellValue: 0.01,
        digits: 2,
        label: "Tenths"
    },

    hundredths: {
        columnValue: 0.01,
        cellValue: 0.001,
        digits: 3,
        label: "Hundredths"
    },

    thousandths: {
        columnValue: 0.001,
        cellValue: 0.0001,
        digits: 4,
        label: "Thousandths"
    }

};


function setOperation(newOperation) {

    operation = newOperation;

    document.querySelectorAll(".operation")
        .forEach(button => {
            button.classList.remove("selected");
        });

    if (operation === "add") {
        document.getElementById("addBtn")
            .classList.add("selected");
    }

    if (operation === "subtract") {
        document.getElementById("subtractBtn")
            .classList.add("selected");
    }

    if (operation === "multiply") {
        document.getElementById("multiplyBtn")
            .classList.add("selected");
    }

    if (operation === "divide") {
        document.getElementById("divideBtn")
            .classList.add("selected");
    }

    const symbols = {
        add: "+",
        subtract: "−",
        multiply: "×",
        divide: "÷"
    };

    document.getElementById("operator").textContent =
        symbols[operation];

    updateResult();
}


function setDecimalPlace(place) {

    decimalPlace = place;

    document.querySelectorAll(".place")
        .forEach(button => {
            button.classList.remove("selected");
        });

    if (place === "tenths") {
        document.getElementById("tenthsBtn")
            .classList.add("selected");
    }

    if (place === "hundredths") {
        document.getElementById("hundredthsBtn")
            .classList.add("selected");
    }

    if (place === "thousandths") {
        document.getElementById("thousandthsBtn")
            .classList.add("selected");
    }

    values.a = 0;
    values.b = 0;

    buildGrid("gridA", "a");
    buildGrid("gridB", "b");

    updateDisplay();
    updateResult();
}


/*
    Creates the vertical grid.

    There are 10 vertical columns.
    Every column is divided into 10
    vertical cells.

    Clicking a cell fills that column
    from the bottom to that cell.
*/

function buildGrid(id, number) {

    const grid = document.getElementById(id);

    const info = placeInfo[decimalPlace];

    grid.innerHTML = "";

    const totalColumns = 10;

    const cellsPerColumn = 10;

    const currentValue = values[number];

    /*
        How many complete column units?
    */
    const completeColumns = Math.floor(
        currentValue / info.columnValue + 0.0000001
    );

    /*
        Remaining amount inside the next column.
    */
    const remainder =
        currentValue -
        (completeColumns * info.columnValue);

    const partialCells = Math.round(
        remainder / info.cellValue
    );

    for (
        let columnIndex = 0;
        columnIndex < totalColumns;
        columnIndex++
    ) {

        const column =
            document.createElement("div");

        column.className = "column";

        for (
            let rowIndex = 0;
            rowIndex < cellsPerColumn;
            rowIndex++
        ) {

            const cell =
                document.createElement("div");

            cell.className = "cell";

            /*
                rowIndex 0 = top
                rowIndex 9 = bottom

                Convert that into a height
                from the bottom.
            */

            const cellsFromBottom =
                cellsPerColumn - rowIndex;

            let filled = false;

            if (columnIndex < completeColumns) {

                filled = true;

            } else if (
                columnIndex === completeColumns &&
                partialCells > 0 &&
                cellsFromBottom <= partialCells
            ) {

                filled = true;
            }

            if (filled) {

                cell.classList.add(
                    number === "a"
                        ? "filled-a"
                        : "filled-b"
                );
            }

            /*
                Clicking ANY cell sets the height
                of the entire column to that point.
            */

            cell.addEventListener("click", () => {

                const clickedHeight =
                    cellsFromBottom;

                /*
                    Columns before this one stay full.
                    This column gets the clicked height.
                    Columns after it become empty.
                */

                const newValue =
                    (columnIndex * info.columnValue) +
                    (clickedHeight * info.cellValue);

                values[number] =
                    Math.round(newValue * 10000) / 10000;

                values[number] =
                    Math.max(0, Math.min(1, values[number]));

                buildGrid("gridA", "a");
                buildGrid("gridB", "b");

                updateDisplay();
                updateResult();
            });

            column.appendChild(cell);
        }

        grid.appendChild(column);
    }
}


function updateDisplay() {

    const digits =
        placeInfo[decimalPlace].digits;

    document.getElementById("valueA").textContent =
        values.a.toFixed(digits);

    document.getElementById("valueB").textContent =
        values.b.toFixed(digits);
}


function updateResult() {

    const error =
        document.getElementById("error");

    error.textContent = "";

    let result;

    if (operation === "add") {

        result =
            values.a + values.b;

    } else if (operation === "subtract") {

        result =
            values.a - values.b;

    } else if (operation === "multiply") {

        result =
            values.a * values.b;

    } else if (operation === "divide") {

        if (values.b === 0) {

            result = 0;

            error.textContent =
                "You cannot divide by zero.";

        } else {

            result =
                values.a / values.b;
        }
    }

    result =
        Math.round(result * 10000) / 10000;

    const digits =
        placeInfo[decimalPlace].digits;

    document.getElementById("resultNumber").textContent =
        result.toFixed(digits);

    buildResultGrid(result);
}


/*
    The result grid shows values between
    0 and 1 visually.

    If multiplication or division produces
    a result greater than 1, the number is
    still shown above the grid.
*/

function buildResultGrid(result) {

    const grid =
        document.getElementById("resultGrid");

    grid.innerHTML = "";

    const totalColumns = 10;
    const cellsPerColumn = 10;

    const info =
        placeInfo[decimalPlace];

    /*
        Only display the positive portion
        that fits inside the square.
    */

    const displayValue =
        Math.max(0, Math.min(1, result));

    const totalCells =
        Math.round(
            displayValue / info.cellValue
        );

    for (
        let columnIndex = 0;
        columnIndex < totalColumns;
        columnIndex++
    ) {

        const column =
            document.createElement("div");

        column.className = "column";

        for (
            let rowIndex = 0;
            rowIndex < cellsPerColumn;
            rowIndex++
        ) {

            const cell =
                document.createElement("div");

            cell.className = "cell";

            const cellNumber =
                columnIndex * cellsPerColumn +
                (cellsPerColumn - rowIndex);

            if (cellNumber <= totalCells) {
                cell.classList.add("result");
            }

            column.appendChild(cell);
        }

        grid.appendChild(column);
    }
}


document.getElementById("addBtn")
    .addEventListener(
        "click",
        () => setOperation("add")
    );

document.getElementById("subtractBtn")
    .addEventListener(
        "click",
        () => setOperation("subtract")
    );

document.getElementById("multiplyBtn")
    .addEventListener(
        "click",
        () => setOperation("multiply")
    );

document.getElementById("divideBtn")
    .addEventListener(
        "click",
        () => setOperation("divide")
    );


document.getElementById("tenthsBtn")
    .addEventListener(
        "click",
        () => setDecimalPlace("tenths")
    );

document.getElementById("hundredthsBtn")
    .addEventListener(
        "click",
        () => setDecimalPlace("hundredths")
    );

document.getElementById("thousandthsBtn")
    .addEventListener(
        "click",
        () => setDecimalPlace("thousandths")
    );


document.getElementById("clearBtn")
    .addEventListener("click", () => {

        values.a = 0;
        values.b = 0;

        buildGrid("gridA", "a");
        buildGrid("gridB", "b");

        updateDisplay();
        updateResult();
    });


buildGrid("gridA", "a");
buildGrid("gridB", "b");

updateDisplay();
updateResult();

</script>

</body>
</html>
