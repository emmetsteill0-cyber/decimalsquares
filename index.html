<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decimal Squares</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        color: #222;
        text-align: center;
    }

    h1 {
        margin: 20px 0 8px;
    }

    .controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin: 15px auto;
    }

    select,
    button {
        padding: 10px 14px;
        font-size: 16px;
        border: 1px solid #aaa;
        border-radius: 6px;
        background: white;
        cursor: pointer;
    }

    button:hover,
    select:hover {
        background: #eee;
    }

    button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
    }

    #squares {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 18px;
        flex-wrap: wrap;
        margin: 20px auto;
        max-width: 1400px;
    }

    .number-box {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .number-label {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    .number-value {
        font-size: 22px;
        font-weight: bold;
        margin-top: 8px;
        min-width: 90px;
    }

    .operator {
        font-size: 34px;
        font-weight: bold;
        margin-top: 150px;
    }

    /* TENTHS */
    .grid.tenths {
        display: grid;
        grid-template-columns: repeat(10, 34px);
        grid-template-rows: 34px;
        gap: 2px;
    }

    /* HUNDREDTHS */
    .grid.hundredths {
        display: grid;
        grid-template-columns: repeat(10, 28px);
        grid-template-rows: repeat(10, 28px);
        gap: 2px;
    }

    /* THOUSANDTHS */
    .grid.thousandths {
        display: grid;
        grid-template-columns: repeat(20, 18px);
        grid-template-rows: repeat(50, 18px);
        gap: 1px;
        max-height: 600px;
    }

    .cell {
        border: 1px solid #777;
        background: white;
        cursor: pointer;
        transition: background 0.1s;
    }

    .cell:hover {
        background: #ddd;
    }

    .cell.filled {
        background: #4b8df8;
    }

    .result-section {
        margin: 30px auto;
        padding: 20px;
        max-width: 1000px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .result-title {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 12px;
    }

    .result-value {
        font-size: 30px;
        font-weight: bold;
        margin-top: 15px;
    }

    #resultGrid {
        display: inline-grid;
        margin-top: 10px;
    }

    .hint {
        color: #666;
        margin-top: 5px;
        font-size: 14px;
    }

    @media (max-width: 700px) {
        .grid.tenths {
            grid-template-columns: repeat(10, 25px);
            grid-template-rows: 25px;
        }

        .grid.hundredths {
            grid-template-columns: repeat(10, 22px);
            grid-template-rows: repeat(10, 22px);
        }

        .grid.thousandths {
            grid-template-columns: repeat(20, 12px);
            grid-template-rows: repeat(50, 12px);
        }
    }
</style>

</head>

<body>

<h1>Decimal Squares</h1>

<div class="controls">

```
<label>
    Place:
    <select id="placeSelect">
        <option value="tenths">Tenths</option>
        <option value="hundredths">Hundredths</option>
        <option value="thousandths">Thousandths</option>
    </select>
</label>

<label>
    Operation:
    <select id="operationSelect">
        <option value="add">Addition (+)</option>
        <option value="subtract">Subtraction (−)</option>
        <option value="multiply">Multiplication (×)</option>
        <option value="divide">Division (÷)</option>
    </select>
</label>

<button id="addButton">＋ Add Square</button>
<button id="removeButton">− Remove Square</button>
<button id="clearButton">Clear</button>
```

</div>

<div class="hint">
    Click the squares to build each decimal.
</div>

<div id="squares"></div>

<div class="result-section">
    <div class="result-title">Result</div>

```
<div id="resultGrid"></div>

<div class="result-value" id="resultValue">0</div>
```

</div>

<script>

let values = [0, 0];

const MIN_SQUARES = 2;
const MAX_SQUARES = 10;

const placeSelect = document.getElementById("placeSelect");
const operationSelect = document.getElementById("operationSelect");
const squaresContainer = document.getElementById("squares");
const resultGrid = document.getElementById("resultGrid");
const resultValue = document.getElementById("resultValue");

const addButton = document.getElementById("addButton");
const removeButton = document.getElementById("removeButton");
const clearButton = document.getElementById("clearButton");


/* -------------------------------------------------
   PLACE SETTINGS
------------------------------------------------- */

function getPlaceInfo() {

    const place = placeSelect.value;

    if (place === "tenths") {
        return {
            className: "tenths",
            cellValue: 0.1,
            columns: 10,
            rows: 1,
            decimals: 1
        };
    }

    if (place === "hundredths") {
        return {
            className: "hundredths",
            cellValue: 0.01,
            columns: 10,
            rows: 10,
            decimals: 2
        };
    }

    return {
        className: "thousandths",
        cellValue: 0.001,
        columns: 20,
        rows: 50,
        decimals: 3
    };
}


/* -------------------------------------------------
   CREATE ONE DECIMAL SQUARE
------------------------------------------------- */

function createSquare(index) {

    const info = getPlaceInfo();

    const box = document.createElement("div");
    box.className = "number-box";

    const label = document.createElement("div");
    label.className = "number-label";
    label.textContent = "Number " + (index + 1);

    const grid = document.createElement("div");
    grid.className = "grid " + info.className;

    /*
       Total number of cells:
       Tenths       = 10
       Hundredths   = 100
       Thousandths  = 1000
    */

    const totalCells = info.columns * info.rows;

    for (let i = 0; i < totalCells; i++) {

        const cell = document.createElement("div");
        cell.className = "cell";

        /*
           Store the value represented by this cell.
        */
        const cellIndex = i;

        cell.addEventListener("click", function() {

            /*
               Clicking a cell fills from the beginning
               of the grid through the clicked cell.
            */
            values[index] = (cellIndex + 1) * info.cellValue;

            /*
               Prevent tiny floating point errors.
            */
            values[index] = Number(
                values[index].toFixed(info.decimals)
            );

            updateAllSquares();

        });

        grid.appendChild(cell);
    }

    const valueDisplay = document.createElement("div");
    valueDisplay.className = "number-value";
    valueDisplay.id = "value-" + index;

    box.appendChild(label);
    box.appendChild(grid);
    box.appendChild(valueDisplay);

    return box;
}


/* -------------------------------------------------
   BUILD ALL NUMBER SQUARES
------------------------------------------------- */

function buildAllSquares() {

    squaresContainer.innerHTML = "";

    for (let i = 0; i < values.length; i++) {

        squaresContainer.appendChild(
            createSquare(i)
        );

        if (i < values.length - 1) {

            const operator = document.createElement("div");
            operator.className = "operator";

            operator.textContent =
                getOperatorSymbol();

            squaresContainer.appendChild(operator);
        }
    }

    updateAllSquares();
}


/* -------------------------------------------------
   OPERATOR SYMBOL
------------------------------------------------- */

function getOperatorSymbol() {

    const operation = operationSelect.value;

    if (operation === "add") {
        return "+";
    }

    if (operation === "subtract") {
        return "−";
    }

    if (operation === "multiply") {
        return "×";
    }

    return "÷";
}


/* -------------------------------------------------
   UPDATE SQUARES
------------------------------------------------- */

function updateAllSquares() {

    const info = getPlaceInfo();

    const boxes =
        document.querySelectorAll(".number-box");

    boxes.forEach((box, index) => {

        const cells =
            box.querySelectorAll(".cell");

        const amount =
            Math.round(values[index] / info.cellValue);

        cells.forEach((cell, cellIndex) => {

            if (cellIndex < amount) {
                cell.classList.add("filled");
            } else {
                cell.classList.remove("filled");
            }

        });

        const display =
            document.getElementById("value-" + index);

        if (display) {

            display.textContent =
                values[index].toFixed(info.decimals);

        }

    });

    calculateResult();
    updateButtons();
}


/* -------------------------------------------------
   CALCULATE RESULT
------------------------------------------------- */

function calculateResult() {

    const operation =
        operationSelect.value;

    let result = values[0];

    if (operation === "add") {

        result = values.reduce(
            (total, value) => total + value,
            0
        );

    }

    else if (operation === "subtract") {

        result = values[0];

        for (let i = 1; i < values.length; i++) {
            result -= values[i];
        }

    }

    else if (operation === "multiply") {

        result = values.reduce(
            (total, value) => total * value,
            1
        );

    }

    else if (operation === "divide") {

        result = values[0];

        for (let i = 1; i < values.length; i++) {

            if (values[i] === 0) {
                result = NaN;
                break;
            }

            result /= values[i];
        }

    }

    if (!Number.isNaN(result)) {

        /*
           Remove floating point errors.
        */
        result =
            Number(result.toFixed(6));

        resultValue.textContent =
            result.toString();

    } else {

        resultValue.textContent =
            "Cannot divide by 0";
    }

    buildResultGrid(result);
}


/* -------------------------------------------------
   RESULT GRID
------------------------------------------------- */

function buildResultGrid(result) {

    resultGrid.innerHTML = "";

    if (!Number.isFinite(result) || result <= 0) {
        return;
    }

    const info = getPlaceInfo();

    /*
       The visual result grid represents 0–1.
       Values greater than 1 are shown numerically.
    */

    const visualResult =
        Math.min(result, 1);

    const amount =
        Math.round(
            visualResult / info.cellValue
        );

    resultGrid.className =
        "grid " + info.className;

    const totalCells =
        info.columns * info.rows;

    for (let i = 0; i < totalCells; i++) {

        const cell =
            document.createElement("div");

        cell.className = "cell";

        if (i < amount) {
            cell.classList.add("filled");
        }

        resultGrid.appendChild(cell);
    }
}


/* -------------------------------------------------
   ADD SQUARE
------------------------------------------------- */

function addSquare() {

    if (values.length >= MAX_SQUARES) {
        return;
    }

    values.push(0);

    buildAllSquares();
}


/* -------------------------------------------------
   REMOVE SQUARE
------------------------------------------------- */

function removeSquare() {

    if (values.length <= MIN_SQUARES) {
        return;
    }

    values.pop();

    buildAllSquares();
}


/* -------------------------------------------------
   CLEAR
------------------------------------------------- */

function clearAll() {

    values =
        values.map(() => 0);

    updateAllSquares();
}


/* -------------------------------------------------
   BUTTON STATE
------------------------------------------------- */

function updateButtons() {

    removeButton.disabled =
        values.length <= MIN_SQUARES;

    addButton.disabled =
        values.length >= MAX_SQUARES;
}


/* -------------------------------------------------
   CONTROLS
------------------------------------------------- */

addButton.addEventListener(
    "click",
    addSquare
);

removeButton.addEventListener(
    "click",
    removeSquare
);

clearButton.addEventListener(
    "click",
    clearAll
);

placeSelect.addEventListener(
    "change",
    function() {

        /*
           Keep the existing decimal amount
           when changing place values, but
           rebuild the correct grid.
        */

        buildAllSquares();
    }
);

operationSelect.addEventListener(
    "change",
    function() {

        buildAllSquares();
    }
);


/* -------------------------------------------------
   START
------------------------------------------------- */

buildAllSquares();

</script>

</body>
</html>
