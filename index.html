<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decimal Squares</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        color: #222;
        text-align: center;
    }

    h1 {
        margin: 20px 0 8px;
    }

    .controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin: 15px auto;
    }

    select,
    button {
        padding: 10px 14px;
        font-size: 16px;
        border: 1px solid #aaa;
        border-radius: 6px;
        background: white;
        cursor: pointer;
    }

    button:hover,
    select:hover {
        background: #eee;
    }

    button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
    }

    #squares {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 18px;
        flex-wrap: wrap;
        margin: 20px auto;
        max-width: 1400px;
    }

    .number-box {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .number-label {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    .number-value {
        font-size: 22px;
        font-weight: bold;
        margin-top: 8px;
        min-width: 90px;
    }

    .operator {
        font-size: 34px;
        font-weight: bold;
        margin-top: 150px;
    }

    /*
       ORIGINAL VERTICAL DESIGN
    */

    .grid {
        display: grid;
        grid-template-columns: repeat(10, 34px);
        grid-template-rows: repeat(10, 34px);
        gap: 2px;
    }

    .cell {
        width: 34px;
        height: 34px;
        border: 1px solid #777;
        background: white;
        cursor: pointer;
        transition: background 0.1s;
    }

    .cell:hover {
        background: #ddd;
    }

    .cell.filled {
        background: #4b8df8;
    }

    .result-section {
        margin: 30px auto;
        padding: 20px;
        max-width: 1000px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .result-title {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 12px;
    }

    .result-value {
        font-size: 30px;
        font-weight: bold;
        margin-top: 15px;
    }

    #resultGrid {
        display: grid;
        grid-template-columns: repeat(10, 34px);
        grid-template-rows: repeat(10, 34px);
        gap: 2px;
        margin: 10px auto 0;
        width: max-content;
    }

    .hint {
        color: #666;
        margin-top: 5px;
        font-size: 14px;
    }

    @media (max-width: 700px) {
        .grid,
        #resultGrid {
            grid-template-columns: repeat(10, 25px);
            grid-template-rows: repeat(10, 25px);
        }

        .cell {
            width: 25px;
            height: 25px;
        }
    }
</style>

</head>

<body>

<h1>Decimal Squares</h1>

<div class="controls">

```
<label>
    Place:
    <select id="placeSelect">
        <option value="tenths">Tenths</option>
        <option value="hundredths">Hundredths</option>
        <option value="thousandths">Thousandths</option>
    </select>
</label>

<label>
    Operation:
    <select id="operationSelect">
        <option value="add">Addition (+)</option>
        <option value="subtract">Subtraction (−)</option>
        <option value="multiply">Multiplication (×)</option>
        <option value="divide">Division (÷)</option>
    </select>
</label>

<button id="addButton">＋ Add Square</button>
<button id="removeButton">− Remove Square</button>
<button id="clearButton">Clear</button>
```

</div>

<div class="hint">
    Click anywhere in a vertical column to fill that column up to where you clicked.
</div>

<div id="squares"></div>

<div class="result-section">
    <div class="result-title">Result</div>

```
<div id="resultGrid"></div>

<div class="result-value" id="resultValue">0</div>
```

</div>

<script>

let values = [0, 0];

const MIN_SQUARES = 2;
const MAX_SQUARES = 10;

const placeSelect =
    document.getElementById("placeSelect");

const operationSelect =
    document.getElementById("operationSelect");

const squaresContainer =
    document.getElementById("squares");

const resultGrid =
    document.getElementById("resultGrid");

const resultValue =
    document.getElementById("resultValue");

const addButton =
    document.getElementById("addButton");

const removeButton =
    document.getElementById("removeButton");

const clearButton =
    document.getElementById("clearButton");


/* -----------------------------------------
   PLACE VALUE
----------------------------------------- */

function getPlaceInfo() {

    const place = placeSelect.value;

    if (place === "tenths") {

        return {
            value: 0.1,
            decimals: 1
        };

    }

    if (place === "hundredths") {

        return {
            value: 0.01,
            decimals: 2
        };

    }

    return {
        value: 0.001,
        decimals: 3
    };
}


/* -----------------------------------------
   CREATE NUMBER SQUARE
----------------------------------------- */

function createSquare(index) {

    const box =
        document.createElement("div");

    box.className = "number-box";

    const label =
        document.createElement("div");

    label.className = "number-label";

    label.textContent =
        "Number " + (index + 1);

    const grid =
        document.createElement("div");

    grid.className = "grid";

    /*
       ALWAYS keep the original 10 × 10
       visual design.

       The selected place changes what
       each cell means.
    */

    for (let row = 0; row < 10; row++) {

        for (let column = 0; column < 10; column++) {

            const cell =
                document.createElement("div");

            cell.className = "cell";

            /*
               IMPORTANT:

               CSS grid is created row-by-row.

               We want clicking a vertical
               column to fill upward from
               the bottom.
            */

            cell.dataset.row = row;
            cell.dataset.column = column;

            cell.addEventListener(
                "click",
                function() {

                    setColumnValue(
                        index,
                        column,
                        row
                    );

                }
            );

            grid.appendChild(cell);
        }
    }

    const valueDisplay =
        document.createElement("div");

    valueDisplay.className =
        "number-value";

    valueDisplay.id =
        "value-" + index;

    box.appendChild(label);
    box.appendChild(grid);
    box.appendChild(valueDisplay);

    return box;
}


/* -----------------------------------------
   CLICK A VERTICAL COLUMN
----------------------------------------- */

function setColumnValue(
    numberIndex,
    clickedColumn,
    clickedRow
) {

    const info =
        getPlaceInfo();

    /*
       In the original design:

       Bottom row = lowest amount
       Top row = full column.

       A column represents:

       Tenths      = 0.1
       Hundredths  = 0.01
       Thousandths = 0.001
    */

    let completedColumns =
        clickedColumn;

    /*
       A click inside a column fills
       that column from the bottom
       through the clicked cell.

       Each column is worth one
       selected decimal place.
    */

    let partialAmount =
        (10 - clickedRow) / 10;

    /*
       Completed columns plus the
       partial clicked column.
    */

    let amount =
        completedColumns * info.value;

    amount +=
        partialAmount * info.value;

    values[numberIndex] =
        Number(
            amount.toFixed(info.decimals)
        );

    updateAllSquares();
}


/* -----------------------------------------
   BUILD ALL SQUARES
----------------------------------------- */

function buildAllSquares() {

    squaresContainer.innerHTML = "";

    for (
        let i = 0;
        i < values.length;
        i++
    ) {

        squaresContainer.appendChild(
            createSquare(i)
        );

        if (i < values.length - 1) {

            const operator =
                document.createElement("div");

            operator.className =
                "operator";

            operator.textContent =
                getOperatorSymbol();

            squaresContainer.appendChild(
                operator
            );
        }
    }

    updateAllSquares();
}


/* -----------------------------------------
   OPERATOR
----------------------------------------- */

function getOperatorSymbol() {

    const operation =
        operationSelect.value;

    if (operation === "add") {
        return "+";
    }

    if (operation === "subtract") {
        return "−";
    }

    if (operation === "multiply") {
        return "×";
    }

    return "÷";
}


/* -----------------------------------------
   UPDATE NUMBER GRIDS
----------------------------------------- */

function updateAllSquares() {

    const info =
        getPlaceInfo();

    const boxes =
        document.querySelectorAll(
            ".number-box"
        );

    boxes.forEach(
        (box, index) => {

            const cells =
                box.querySelectorAll(
                    ".cell"
                );

            /*
               Convert the decimal into
               tenths of the selected
               place.

               Example:

               Tenths:
               0.5 → 5 filled columns

               Hundredths:
               0.50 → 5 filled columns

               Thousandths:
               0.500 → 5 filled columns
            */

            const columnAmount =
                values[index] / info.value;

            const fullColumns =
                Math.floor(columnAmount);

            const partial =
                columnAmount -
                fullColumns;

            cells.forEach(
                (cell) => {

                    const row =
                        Number(cell.dataset.row);

                    const column =
                        Number(cell.dataset.column);

                    /*
                       Columns before the
                       current amount are full.
                    */

                    if (
                        column < fullColumns
                    ) {

                        cell.classList.add(
                            "filled"
                        );

                        return;
                    }

                    /*
                       The next column is
                       partially filled from
                       the bottom.
                    */

                    if (
                        column === fullColumns
                        &&
                        partial > 0
                    ) {

                        const cellsToFill =
                            Math.round(
                                partial * 10
                            );

                        const bottomRow =
                            9 - row;

                        if (
                            bottomRow <
                            cellsToFill
                        ) {

                            cell.classList.add(
                                "filled"
                            );

                        } else {

                            cell.classList.remove(
                                "filled"
                            );

                        }

                        return;
                    }

                    cell.classList.remove(
                        "filled"
                    );

                }
            );

            const display =
                document.getElementById(
                    "value-" + index
                );

            display.textContent =
                values[index].toFixed(
                    info.decimals
                );

        }
    );

    calculateResult();
    updateButtons();
}


/* -----------------------------------------
   CALCULATE
----------------------------------------- */

function calculateResult() {

    const operation =
        operationSelect.value;

    let result = values[0];

    if (operation === "add") {

        result =
            values.reduce(
                (total, value) =>
                    total + value,
                0
            );

    }

    else if (
        operation === "subtract"
    ) {

        result = values[0];

        for (
            let i = 1;
            i < values.length;
            i++
        ) {

            result -= values[i];

        }

    }

    else if (
        operation === "multiply"
    ) {

        result =
            values.reduce(
                (total, value) =>
                    total * value,
                1
            );

    }

    else if (
        operation === "divide"
    ) {

        result = values[0];

        for (
            let i = 1;
            i < values.length;
            i++
        ) {

            if (values[i] === 0) {

                result = NaN;
                break;

            }

            result /= values[i];

        }
    }

    if (Number.isNaN(result)) {

        resultValue.textContent =
            "Cannot divide by 0";

    } else {

        result =
            Number(
                result.toFixed(6)
            );

        resultValue.textContent =
            result.toString();

    }

    buildResultGrid(result);
}


/* -----------------------------------------
   RESULT GRID
----------------------------------------- */

function buildResultGrid(result) {

    resultGrid.innerHTML = "";

    if (
        !Number.isFinite(result) ||
        result <= 0
    ) {
        return;
    }

    /*
       The result grid keeps the
       original design.

       It visually represents
       values from 0 to 1.
    */

    const info =
        getPlaceInfo();

    const visualResult =
        Math.min(result, 1);

    const cellsToFill =
        Math.round(
            visualResult / 0.01
        );

    for (
        let row = 0;
        row < 10;
        row++
    ) {

        for (
            let column = 0;
            column < 10;
            column++
        ) {

            const cell =
                document.createElement(
                    "div"
                );

            cell.className =
                "cell";

            /*
               Convert row/column into
               bottom-to-top cell number.
            */

            const cellNumber =
                column * 10 +
                (9 - row);

            /*
               The visual result is
               scaled according to the
               selected decimal place.
            */

            let filled;

            if (
                placeSelect.value ===
                "tenths"
            ) {

                filled =
                    cellNumber <
                    Math.round(
                        visualResult * 10
                    ) * 10;

            }

            else if (
                placeSelect.value ===
                "hundredths"
            ) {

                filled =
                    cellNumber <
                    Math.round(
                        visualResult * 100
                    );

            }

            else {

                filled =
                    cellNumber <
                    Math.round(
                        visualResult * 100
                    );

            }

            if (filled) {

                cell.classList.add(
                    "filled"
                );

            }

            resultGrid.appendChild(
                cell
            );
        }
    }
}


/* -----------------------------------------
   ADD NUMBER SQUARE
----------------------------------------- */

function addSquare() {

    if (
        values.length >= MAX_SQUARES
    ) {
        return;
    }

    values.push(0);

    buildAllSquares();
}


/* -----------------------------------------
   REMOVE NUMBER SQUARE
----------------------------------------- */

function removeSquare() {

    if (
        values.length <= MIN_SQUARES
    ) {
        return;
    }

    values.pop();

    buildAllSquares();
}


/* -----------------------------------------
   CLEAR
----------------------------------------- */

function clearAll() {

    values =
        values.map(() => 0);

    updateAllSquares();
}


/* -----------------------------------------
   BUTTON STATES
----------------------------------------- */

function updateButtons() {

    removeButton.disabled =
        values.length <=
        MIN_SQUARES;

    addButton.disabled =
        values.length >=
        MAX_SQUARES;
}


/* -----------------------------------------
   CONTROLS
----------------------------------------- */

addButton.addEventListener(
    "click",
    addSquare
);

removeButton.addEventListener(
    "click",
    removeSquare
);

clearButton.addEventListener(
    "click",
    clearAll
);

placeSelect.addEventListener(
    "change",
    function() {

        /*
           DO NOT change the design.

           Only change what each
           cell represents.
        */

        buildAllSquares();

    }
);

operationSelect.addEventListener(
    "change",
    function() {

        buildAllSquares();

    }
);


/* -----------------------------------------
   START
----------------------------------------- */

buildAllSquares();

</script>

</body>
</html>
